name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      intentional_failure:
        description: "Set to 1 to run the intentionally failing test (proves the deploy gate)"
        default: "0"

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      INTENTIONAL_FAILURE: ${{ github.event.inputs.intentional_failure || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Tests (pytest)
        # shell: bash enables "-eo pipefail", so a failing pytest fails the step
        # even though its output is piped through tee.
        shell: bash
        run: pytest -v | tee pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-log
          path: pytest.log

  build:
    # Runs only if lint-test passed.
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (layer cache via GitHub Actions cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: apex-ops-api:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: apex-ops-api:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Verify container runs as non-root
        run: |
          uid=$(docker run --rm --entrypoint id apex-ops-api:${{ github.sha }} -u)
          echo "uid=$uid"; test "$uid" != "0"

  publish:
    # Push to GHCR only on main or a version tag, and only after build (and so tests + scan) passed.
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags (semver on v*.*.* tags, always the commit SHA)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-local-smoke:
    # Deployment gate: only runs if lint-test AND build both passed.
    # Exercises the real deploy.sh and rollback.sh blue/green scripts on the CI runner.
    needs: [lint-test, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create throwaway env file (CI-only, synthetic)
        run: |
          cp .env.example .env
          echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)" >> .env
      - name: Deploy release 1
        run: ./scripts/deploy.sh ci-${GITHUB_SHA::7}-1
      - name: Smoke test (CRUD through the proxy)
        run: |
          curl -fsS localhost:8000/health
          curl -fsS localhost:8000/readiness
          curl -fsS -X POST localhost:8000/api/v1/incidents -H 'content-type: application/json' \
            -d '{"title":"CI smoke incident","severity":"low"}'
          curl -fsS localhost:8000/api/v1/incidents
      - name: Deploy release 2 (blue/green switch)
        run: |
          ./scripts/deploy.sh ci-${GITHUB_SHA::7}-2
          curl -fsS localhost:8000/health | grep "ci-${GITHUB_SHA::7}-2"
      - name: Roll back to release 1
        run: |
          ./scripts/rollback.sh
          curl -fsS localhost:8000/health | grep "ci-${GITHUB_SHA::7}-1"
      - name: Data survived the switch and rollback
        run: curl -fsS localhost:8000/api/v1/incidents | grep "CI smoke incident"
      - name: Logs on failure
        if: failure()
        run: docker compose --profile green logs
      - name: Tear down
        if: always()
        run: docker compose --profile green --profile monitoring down -v